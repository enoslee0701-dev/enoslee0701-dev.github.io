  <!-- 启动画面：Flutter 引擎加载期间显示纸色底 + 图标，首帧出来后移除（深色跟系统） -->
  <style>
    html, body { margin: 0; background: #F7F3EA; }
    #bc-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #F7F3EA; transition: opacity .25s; }
    #bc-splash img { width: 96px; height: 96px; border-radius: 22px; }
    @media (prefers-color-scheme: dark) { html, body, #bc-splash { background: #171F2C; } }
  </style>
</head>
<body>
  <div id="bc-splash" aria-hidden="true"><img src="icons/Icon-maskable-192.png" alt=""></div>
  <script>
    // 安卓 Chrome 的「安装」事件：先存起来，App 里的引导卡片点「安装」时再弹出（lib/core/install_hint_web.dart）
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__bcInstallPrompt = e; });
    window.addEventListener('appinstalled', () => { window.__bcInstallPrompt = null; });
    window.addEventListener('flutter-first-frame', () => {
      const s = document.getElementById('bc-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(() => s.remove(), 300);
    }, { once: true });
  </script>
